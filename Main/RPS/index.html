<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="upper">
        <h1>Choose Your Desired TYPE! </h1>
    </div>
    <div class="choices">
        <div class="circles" id="rock">
            <img src="https://images.unsplash.com/photo-1614032686163-bdc24c13d0b6?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="">
        </div>
        <div class="circles" id="paper">
            <img src="https://images.unsplash.com/photo-1614032686158-b880f7e82c18?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDF8fHxlbnwwfHx8fHw%3D"
                alt="">
        </div>
        <div class="circles" id="scissors">
            <img src="https://images.unsplash.com/photo-1614032686099-e648d6dea9b3?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="">
        </div>
    </div>
    </div>
    <div class="scores">
        <div class="you">
            <h2 id="you">0</h2>
            <p>YOU</p>
        </div>
        <div class="comp">
            <h2 id="comp">0</h2>
            <p>COMP</p>
        </div>
    </div>
    <div class="message">
        <div class="final">

            <h1 id="finalmessage">Please Click Any OPTION!</h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
