<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="weather-app" class="app-container">
      <h1 class="app-title">Weather Forecast</h1>

      <!-- SEARCH SECTION -->
      <div id="search-container" class="search-box">
        <input
          type="text"
          id="city-input"
          class="input-field"
          placeholder="Enter city name..."
        />
        <button id="search-btn" class="search-button">Search</button>
      </div>

      <!-- ERROR MESSAGE (Hidden by default) -->
      <div id="error-container" class="error-box hidden">
        <span class="error-icon">⚠️</span>
        <p id="error-message" class="error-text">
          City not found. Please check your spelling and try again.
        </p>
      </div>

      <!-- WEATHER CARD (Hidden by default until data is fetched) -->
      <div id="weather-card" class="weather-card hidden">
        <!-- Header: Location & Date -->
        <div class="card-header">
          <h2 id="city-name" class="city-name">City Name</h2>
          <p id="current-date" class="current-date">Date</p>
        </div>

        <!-- Main: Icon, Temp, Description -->
        <div class="card-main">
          <img
            id="weather-icon"
            class="weather-icon"
            src=""
            alt="Weather Icon"
          />
          <p id="temperature" class="temperature">00°C</p>
          <p id="weather-description" class="description">Weather Condition</p>
        </div>

        <!-- Details: Humidity, Wind, Feels Like -->
        <div class="card-details">
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value">00%</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind Speed</span>
            <span id="wind-speed" class="detail-value">00 km/h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Feels Like</span>
            <span id="feels-like" class="detail-value">00°C</span>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
